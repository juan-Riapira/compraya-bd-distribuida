# Balanceador de carga delante de las 3 réplicas de la API.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream compraya_api {
        least_conn;                       # envía al nodo con menos conexiones activas
        server api-1:8000 max_fails=3 fail_timeout=10s;
        server api-2:8000 max_fails=3 fail_timeout=10s;
        server api-3:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://compraya_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Si una réplica cae, la petición se reintenta en otra (solo si es segura).
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;

            add_header X-Served-By $upstream_addr always;
        }
    }
}
